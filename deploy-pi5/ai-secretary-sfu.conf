[Service]
# SFU ハブは 2026-08-30 に Pi 3 から この Pi 5 自身へ移設した。
# 旧既定の sfu-hub.local(=Pi3) は電源断で解決不能になっている。
#
# この値は API 経由でブラウザにもそのまま渡るため、localhost にしてはいけない
# （ブラウザ自身を指してしまう）。名前で統一する。
# avahi は eth0 のみ広告する設定にしてあるので pi5.local は常に有線IPを指す。
Environment=SFU_HUB_URL=http://pi5.local:8080
Environment=SFU_HUB_HTTPS_URL=https://pi5.local:5443

# 5443 は nginx が TLS 終端して受ける（ダッシュボードとハブを同一オリジンに
# 統合し、自己署名証明書の承認を1回で済ませるため）。
# Flask 自身は HTTP:5000 のみを提供する。
