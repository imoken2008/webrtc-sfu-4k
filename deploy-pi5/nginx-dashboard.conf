# ダッシュボードと SFU ハブを 1つのオリジンに統合する。
#
# 従来はダッシュボード(5443)とハブ(8443)が別オリジンだったため、
# 自己署名証明書をブラウザに2回承認させる必要があり、片方でも未承認だと
# socket.io の接続が黙って失敗して「映像だけ来ない」状態になっていた。
# ここで TLS を1箇所に集約し、承認を1回で済ませる。
server {
    listen 5443 ssl;
    listen [::]:5443 ssl;
    server_name pi5.local pi5 _;

    ssl_certificate     /home/pi/sfu-hub/ssl/cert.pem;
    ssl_certificate_key /home/pi/sfu-hub/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 4K のプレビューや画像を通すので上限を上げる
    client_max_body_size 64m;

    # --- SFU ハブ（WebSocket） ---
    # ダッシュボード自身は socket.io を使っていないので、このパスは空いている
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSocket は無通信でも切らない
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- ハブの REST API ---
    location /api/ingest/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
    }

    # --- ダッシュボード本体 ---
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        # MJPEG など逐次配信をバッファさせない
        proxy_buffering off;
    }
}
